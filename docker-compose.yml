services:
  recur-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    image: recur-inspector:latest
    container_name: recur-inspector
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
