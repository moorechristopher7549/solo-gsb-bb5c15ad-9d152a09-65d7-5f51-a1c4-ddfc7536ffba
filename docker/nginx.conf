server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ICS 完全在浏览器本地解析，无需后端
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
